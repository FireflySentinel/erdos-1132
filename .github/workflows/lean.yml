name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject unfinished proofs
        run: |
          if grep -RnE '\b(sorry|admit)\b' --include='*.lean' Erdos1132 Erdos1132.lean checks; then
            exit 1
          fi
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Remove cached modules whose sources were moved or deleted
        run: python3 scripts/prune_obsolete_modules.py
      - name: Check axioms and the explicit statement
        run: lake test
      - name: Replay project declarations through the kernel
        run: lake env leanchecker -v Erdos1132
